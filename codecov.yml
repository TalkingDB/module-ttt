coverage:
  status:
    project:
      default:
        # Don't fail small early PRs while the suite is still thin;
        # tighten this once coverage has a real baseline.
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/**"
  - "assets/**"
  - "app/main.py"
  - "app/services/job_daemon.py"
